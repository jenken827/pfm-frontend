name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 代码生成（l10n + build_runner）
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: 静态检查
        run: flutter analyze

      - name: 测试
        run: flutter test
